name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        run: |
          date=$(date -u +'%Y.%-m.%-d')
          build=$(( $(git tag -l "v$date.*" | wc -l) + 1 ))
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "value=$date.$build" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build src/cs/RedFox.slnx -c Release -p:BuildNumber=${{ steps.version.outputs.build }}

      - name: Pack
        run: dotnet pack src/cs/RedFox.slnx -c Release --no-build -p:BuildNumber=${{ steps.version.outputs.build }} -o artifacts

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v${{ steps.version.outputs.value }} artifacts/* --title "v${{ steps.version.outputs.value }}" --generate-notes
